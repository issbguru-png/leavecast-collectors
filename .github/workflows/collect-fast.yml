name: collect-fast (tsa + faa)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency:
  group: collect-fast
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
      - name: TSA security waits
        env:
          TSAWAITTIMES_API_KEY: ${{ secrets.TSAWAITTIMES_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs tsa
      - name: Collect first-party airport feeds (JFK/LGA/EWR/DCA/IAD/DTW/PHX/PHL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs firstparty
        continue-on-error: true
      - name: FAA NAS status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs faa
