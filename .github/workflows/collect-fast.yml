name: collect-fast (first-party + faa)
on:
  # The web pinger (external cron) drives the real ~10-min cadence via
  # workflow_dispatch. This schedule is a backup only, kept slow so it rarely
  # fires mid-gap and lets the Neon compute suspend between pinger-driven runs.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
concurrency:
  group: collect-fast
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
      # 'tsa' (paid reseller) retired 2026-11-03 — account deleted. Former-reseller
      # airports are now served from our own history; there is nothing to collect.
      - name: Collect first-party airport feeds (JFK/LGA/EWR/DCA/IAD/DTW/PHX/PHL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs firstparty
        continue-on-error: true
      # Headless collectors (DFW/MCO/CLT/IAH) moved to collect-headless.yml,
      # which the web pinger drives via workflow_dispatch every ~5 min. Keeping
      # them here too would double-run Chromium whenever this throttled schedule
      # happens to fire.
      - name: FAA NAS status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs faa
