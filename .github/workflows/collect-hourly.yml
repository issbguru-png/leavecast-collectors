name: collect-hourly (nws + cbp)
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
concurrency:
  group: collect-hourly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
      - name: NWS weather
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs nws
      - name: CBP customs waits
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node collectors/run.mjs cbp
